services:
  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      DB_HOST: db
      DB_NAME: callnyc
      DB_USER: callnyc
      DB_PASS: callnyc
      DB_PORT: 3306
      CALLNYC_ARCHIVED: "1"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: callnyc
      MYSQL_USER: callnyc
      MYSQL_PASSWORD: callnyc
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
